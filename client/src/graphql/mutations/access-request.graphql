mutation CreateAccessRequest($input: access_requests_insert_input!) {
    insert_access_requests_one(
        object: $input
        on_conflict: {
            constraint: access_requests_document_id_requester_id_key
            update_columns: [permission_type, status, message, updated_at]
        }
    ) {
        id
        document_id
        requester_id
        owner_id
        status
        message
        permission_type
        created_at
        updated_at
    }
}

mutation BulkDeleteAccessRequests(
    $document_ids: [uuid!]!
    $requester_id: uuid!
) {
    delete_access_requests(
        where: {
            document_id: { _in: $document_ids }
            requester_id: { _eq: $requester_id }
        }
    ) {
        affected_rows
        returning {
            id
            document_id
        }
    }
}
