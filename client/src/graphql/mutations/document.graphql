mutation SoftDeleteDocument($id: uuid!) {
    update_blocks_by_pk(
        pk_columns: { id: $id }
        _set: { deleted_at: "now()" }
    ) {
        id
    }
}

mutation MaterializeDocument(
    $document: blocks_insert_input!
    $blocks: [blocks_insert_input!]!
) {
    insert_blocks_one(object: $document) {
        id
        content
        cover_image
        position
        parent_id
        page_id
        type
        workspace_id
        user_id
        created_at
        updated_at
        link_access {
            permission_type
        }
        tasks {
            id
            status
            deadline_date
            schedule_date
            priority
            user_id
        }
        document_stars {
            document_id
        }
        folder {
            id
            name
        }
    }

    insert_blocks(objects: $blocks) {
        returning {
            id
            content
            cover_image
            position
            parent_id
            page_id
            type
            workspace_id
            user_id
            created_at
            updated_at
            link_access {
                permission_type
            }
            tasks {
                id
                status
                deadline_date
                schedule_date
                priority
                user_id
            }
        }
    }
}

mutation UpdateBlock($id: uuid!, $input: blocks_set_input!) {
    update_blocks_by_pk(pk_columns: { id: $id }, _set: $input) {
        id
        content
        cover_image
        position
        parent_id
        page_id
        type
        created_at
        updated_at
    }
}

mutation DeleteBlock($id: uuid!) {
    delete_blocks_by_pk(id: $id) {
        id
    }
}

mutation InsertBlocksAndUpdatePositions(
    $blocks: [blocks_insert_input!]!
    $updates: [blocks_updates!]!
) {
    update_blocks_many(updates: $updates) {
        affected_rows
    }

    insert_blocks(objects: $blocks) {
        returning {
            id
            content
            cover_image
            position
            parent_id
            page_id
            type
            created_at
            updated_at
        }
    }
}

mutation UpdateBlocksPositions($updates: [blocks_updates!]!) {
    update_blocks_many(updates: $updates) {
        returning {
            id
            position
            updated_at
        }
    }
}

mutation MoveDocumentToFolder($id: uuid!, $folderId: uuid) {
    update_blocks_by_pk(
        pk_columns: { id: $id }
        _set: { folder_id: $folderId }
    ) {
        id
        folder_id
        folder {
            id
            name
        }
    }
}

mutation BulkMoveDocumentsToFolder($ids: [uuid!]!, $folderId: uuid) {
    update_blocks(
        where: { id: { _in: $ids } }
        _set: { folder_id: $folderId }
    ) {
        affected_rows
        returning {
            id
            folder_id
        }
    }
}

mutation BulkDeleteDocuments($ids: [uuid!]!) {
    update_blocks(where: { id: { _in: $ids } }, _set: { deleted_at: "now()" }) {
        affected_rows
        returning {
            id
            deleted_at
        }
    }
}

mutation BulkDeleteDocumentsAndFolders(
    $documentIds: [uuid!]!
    $folderIds: [uuid!]!
) {
    delete_documents: update_blocks(
        where: { id: { _in: $documentIds } }
        _set: { deleted_at: "now()" }
    ) {
        affected_rows
    }
    delete_folders: delete_folders(where: { id: { _in: $folderIds } }) {
        affected_rows
    }
}
