query GetDocumentStar($documentId: uuid!, $userId: uuid!) {
    document_stars_by_pk(document_id: $documentId, user_id: $userId) {
        document_id
        created_at
    }
}

query GetStarredDocuments {
    document_stars(
        where: {
            document: { type: { _eq: "page" }, deleted_at: { _is_null: true } }
        }
        order_by: { created_at: desc }
    ) {
        document_id
        created_at
        document {
            id
            content
            workspace_id
            user_id
            folder {
                id
            }
        }
    }
}

query GetStarredDocumentsPage {
    document_stars(
        where: {
            document: { type: { _eq: "page" }, deleted_at: { _is_null: true } }
        }
        order_by: { created_at: desc }
    ) {
        document {
            id
            content
            cover_image
            created_at
            updated_at
            workspace_id
            user_id
            document_stars {
                document_id
            }
            folder {
                id
                name
            }
            sub_blocks(order_by: { position: asc }, limit: 10) {
                id
                type
                content
                tasks {
                    id
                    status
                    schedule_date
                    deadline_date
                }
            }
        }
    }
}

query GetDocumentsToStar($workspaceId: uuid!, $userId: uuid!) {
    blocks(
        where: {
            type: { _eq: "page" }
            deleted_at: { _is_null: true }
            _or: [
                { workspace_id: { _eq: $workspaceId } }
                {
                    access_requests: {
                        requester_id: { _eq: $userId }
                        status: { _eq: "approved" }
                    }
                }
            ]
        }
        order_by: { updated_at: desc }
    ) {
        id
        content
        workspace_id
        folder {
            id
            name
        }
        document_stars {
            document_id
        }
    }
}

mutation StarDocument($documentId: uuid!) {
    delete_existing_star: delete_document_stars(
        where: { document_id: { _eq: $documentId } }
    ) {
        affected_rows
    }
    insert_document_stars_one(object: { document_id: $documentId }) {
        document_id
        created_at
    }
}

mutation UnstarDocument($documentId: uuid!, $userId: uuid!) {
    delete_document_stars_by_pk(document_id: $documentId, user_id: $userId) {
        document_id
    }
}

mutation StarDocuments(
    $documentIds: [uuid!]!
    $objects: [document_stars_insert_input!]!
) {
    delete_existing_stars: delete_document_stars(
        where: { document_id: { _in: $documentIds } }
    ) {
        affected_rows
    }
    insert_document_stars(objects: $objects) {
        affected_rows
        returning {
            document_id
        }
    }
}

mutation UnstarDocuments($documentIds: [uuid!]!) {
    delete_document_stars(where: { document_id: { _in: $documentIds } }) {
        affected_rows
        returning {
            document_id
        }
    }
}
