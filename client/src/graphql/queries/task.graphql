query GetAllTasks($workspaceId: uuid!) {
    tasks(
        where: {
            block: {
                workspace_id: { _eq: $workspaceId }
                page_id: { _is_null: true }
            }
            status: { _neq: "completed" }
        }
        order_by: { created_at: desc }
    ) {
        id
        block_id
        user_id
        status
        deadline_date
        schedule_date
        priority
        created_at
        updated_at
        block {
            id
            content
            type
        }
    }
}

