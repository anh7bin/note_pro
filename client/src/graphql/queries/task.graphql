query GetAllTasks($workspaceId: uuid!) {
    tasks(
        where: {
            block: {
                workspace_id: { _eq: $workspaceId }
                deleted_at: { _is_null: true }
                _or: [
                    { page_id: { _is_null: true } }
                    { page: { deleted_at: { _is_null: true } } }
                ]
            }
            status: { _neq: "completed" }
        }
        order_by: { created_at: desc }
    ) {
        id
        block_id
        user_id
        status
        deadline_date
        schedule_date
        priority
        created_at
        updated_at
        block {
            id
            content
            type
            page_id
            page {
                id
                content
            }
        }
    }
}

