query GetAllScheduledTasks($workspaceId: uuid!) {
    tasks(
        where: {
            block: { workspace_id: { _eq: $workspaceId } }
            schedule_date: { _is_null: false }
            status: { _neq: "completed" }
        }
        order_by: { schedule_date: asc }
    ) {
        id
        block_id
        user_id
        status
        deadline_date
        schedule_date
        priority
        created_at
        updated_at
        block {
            id
            content
            type
            page_id
            page {
                id
                content
            }
        }
    }
}

query GetTodayTasks($workspaceId: uuid!, $today: date!) {
    tasks(
        where: {
            block: {
                workspace_id: { _eq: $workspaceId }
                page_id: { _is_null: true }
            }
            schedule_date: { _eq: $today }
            status: { _neq: "completed" }
        }
        order_by: { created_at: desc }
    ) {
        id
        block_id
        user_id
        status
        deadline_date
        schedule_date
        priority
        created_at
        updated_at
        block {
            id
