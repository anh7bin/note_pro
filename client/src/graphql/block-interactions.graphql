query GetBlockInteractions($pageId: uuid!) {
    mention_users: get_document_mention_users(args: { document_id: $pageId }) {
        id
        email
        name
        avatar_url
    }
    block_comments(
        where: {
            block: {
                _or: [{ id: { _eq: $pageId } }, { page_id: { _eq: $pageId } }]
            }
        }
        order_by: { created_at: asc }
    ) {
        id
        block_id
        user_id
        content
        mentioned_user_ids
        created_at
        user {
            id
            name
            avatar_url
        }
    }
    block_reactions(
        where: {
            block: {
                _or: [{ id: { _eq: $pageId } }, { page_id: { _eq: $pageId } }]
            }
        }
        order_by: { created_at: asc }
    ) {
        id
        block_id
        user_id
        emoji
        created_at
        user {
            id
            name
            avatar_url
        }
    }
}

