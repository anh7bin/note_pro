query GetBlockInteractions($pageId: uuid!) {
    block_comments(
        where: {
            block: {
                _or: [{ id: { _eq: $pageId } }, { page_id: { _eq: $pageId } }]
            }
        }
        order_by: { created_at: asc }
    ) {
        id
        block_id
        user_id
        content
        created_at
        user {
            id
            name
            avatar_url
        }
    }
    block_reactions(
        where: {
            block: {
                _or: [{ id: { _eq: $pageId } }, { page_id: { _eq: $pageId } }]
            }
        }
        order_by: { created_at: asc }
    ) {
        id
        block_id
        user_id
        emoji
        created_at
        user {
            id
            name
            avatar_url
        }
    }
}

