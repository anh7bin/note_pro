table:
  name: tasks
  schema: public
object_relationships:
  - name: block
    using:
      foreign_key_constraint_on: block_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        block:
          _or:
            - workspace:
                created_by:
                  _eq: X-Hasura-User-Id
            - page:
                access_requests:
                  permission_type:
                    _eq: write
                  requester_id:
                    _eq: X-Hasura-User-Id
                  status:
                    _eq: approved
            - page:
                link_access:
                  permission_type:
                    _eq: write
      columns:
        - deadline_date
        - schedule_date
        - priority
        - status
        - created_at
        - updated_at
        - block_id
        - id
        - user_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - deadline_date
        - schedule_date
        - priority
        - status
        - created_at
        - updated_at
        - block_id
        - id
        - user_id
      filter:
        block:
          _or:
            - workspace:
                created_by:
                  _eq: X-Hasura-User-Id
            - page:
                access_requests:
                  requester_id:
                    _eq: X-Hasura-User-Id
                  status:
                    _eq: approved
            - page:
                link_access:
                  permission_type:
                    _in:
                      - read
                      - write
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - deadline_date
        - schedule_date
        - priority
        - status
        - created_at
        - updated_at
        - block_id
        - id
        - user_id
      filter:
        block:
          _or:
            - workspace:
                created_by:
                  _eq: X-Hasura-User-Id
            - page:
                access_requests:
                  permission_type:
                    _eq: write
                  requester_id:
                    _eq: X-Hasura-User-Id
                  status:
                    _eq: approved
            - page:
                link_access:
                  permission_type:
                    _eq: write
      check:
        block:
          _or:
            - workspace:
                created_by:
                  _eq: X-Hasura-User-Id
            - page:
                access_requests:
                  permission_type:
                    _eq: write
                  requester_id:
                    _eq: X-Hasura-User-Id
                  status:
                    _eq: approved
            - page:
                link_access:
                  permission_type:
                    _eq: write
    comment: ""
