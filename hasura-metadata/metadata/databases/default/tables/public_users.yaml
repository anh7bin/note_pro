table:
  name: users
  schema: public
array_relationships:
  - name: access_requests
    using:
      foreign_key_constraint_on:
        column: requester_id
        table:
          name: access_requests
          schema: public
  - name: block_comments
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: block_comments
          schema: public
  - name: block_reactions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: block_reactions
          schema: public
  - name: blocks
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: blocks
          schema: public
  - name: files
    using:
      foreign_key_constraint_on:
        column: uploaded_by
        table:
          name: files
          schema: public
  - name: document_stars
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: document_stars
          schema: public
  - name: document_presences
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: document_presence
          schema: public
  - name: folders
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: folders
          schema: public
  - name: tasks
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: tasks
          schema: public
  - name: workspaces
    using:
      foreign_key_constraint_on:
        column: created_by
        table:
          name: workspaces
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - name
        - avatar_url
        - created_at
        - role
      filter:
        _or:
          - id:
              _eq: X-Hasura-User-Id
          - blocks:
              _or:
                - workspace:
                    created_by:
                      _eq: X-Hasura-User-Id
                - access_requests:
                    requester_id:
                      _eq: X-Hasura-User-Id
                    _or:
                      - status:
                          _eq: approved
                      - permission_type:
                          _eq: write
                        status:
                          _eq: pending
                - page:
                    access_requests:
                      requester_id:
                        _eq: X-Hasura-User-Id
                      _or:
                        - status:
                            _eq: approved
                        - permission_type:
                            _eq: write
                          status:
                            _eq: pending
                - link_access:
                    permission_type:
                      _in:
                        - read
                        - write
                - page:
                    link_access:
                      permission_type:
                        _in:
                          - read
                          - write
          - access_requests:
              document:
                user_id:
                  _eq: X-Hasura-User-Id
          - block_comments:
              block:
                _or:
                  - workspace:
                      created_by:
                        _eq: X-Hasura-User-Id
                  - access_requests:
                      requester_id:
                        _eq: X-Hasura-User-Id
                      _or:
                        - status:
                            _eq: approved
                        - permission_type:
                            _eq: write
                          status:
                            _eq: pending
                  - page:
                      access_requests:
                        requester_id:
                          _eq: X-Hasura-User-Id
                        _or:
                          - status:
                              _eq: approved
                          - permission_type:
                              _eq: write
                            status:
                              _eq: pending
                  - link_access:
                      permission_type:
                        _in:
                          - read
                          - write
                  - page:
                      link_access:
                        permission_type:
                          _in:
                            - read
                            - write
          - block_reactions:
              block:
                _or:
                  - workspace:
                      created_by:
                        _eq: X-Hasura-User-Id
                  - access_requests:
                      requester_id:
                        _eq: X-Hasura-User-Id
                      _or:
                        - status:
                            _eq: approved
                        - permission_type:
                            _eq: write
                          status:
                            _eq: pending
                  - page:
                      access_requests:
                        requester_id:
                          _eq: X-Hasura-User-Id
                        _or:
                          - status:
                              _eq: approved
                          - permission_type:
                              _eq: write
                            status:
                              _eq: pending
                  - link_access:
                      permission_type:
                        _in:
                          - read
                          - write
                  - page:
                      link_access:
                        permission_type:
                          _in:
                            - read
                            - write
          - document_presences:
              document:
                _and:
                  - type:
                      _eq: page
                  - deleted_at:
                      _is_null: true
                  - _or:
                      - workspace:
                          created_by:
                            _eq: X-Hasura-User-Id
                      - access_requests:
                          requester_id:
                            _eq: X-Hasura-User-Id
                          _or:
                            - status:
                                _eq: approved
                            - permission_type:
                                _eq: write
                              status:
                                _eq: pending
                      - link_access:
                          permission_type:
                            _in:
                              - read
                              - write
    comment: ""
