table:
  name: document_link_access
  schema: public
object_relationships:
  - name: document
    using:
      foreign_key_constraint_on: document_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - document:
              user_id:
                _eq: X-Hasura-User-Id
          - document:
              access_requests:
                permission_type:
                  _eq: write
                requester_id:
                  _eq: X-Hasura-User-Id
                status:
                  _eq: approved
      columns:
        - document_id
        - permission_type
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - document_id
        - permission_type
        - updated_at
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - permission_type
        - updated_at
      filter:
        _or:
          - document:
              user_id:
                _eq: X-Hasura-User-Id
          - document:
              access_requests:
                permission_type:
                  _eq: write
                requester_id:
                  _eq: X-Hasura-User-Id
                status:
                  _eq: approved
      check:
        _or:
          - document:
              user_id:
                _eq: X-Hasura-User-Id
          - document:
              access_requests:
                permission_type:
                  _eq: write
                requester_id:
                  _eq: X-Hasura-User-Id
                status:
                  _eq: approved
delete_permissions:
  - role: user
    permission:
      filter:
        document:
          user_id:
            _eq: X-Hasura-User-Id
