- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        connection_lifetime: 600
        idle_timeout: 180
        max_connections: 50
        retries: 1
      use_prepared_statements: true
  tables: "!include default/tables/tables.yaml"
  functions:
    - function:
        name: get_document_mention_users
        schema: public
      configuration:
        session_argument: hasura_session
      permissions:
        - role: user
    - function:
        name: search_invitee
        schema: public
      configuration:
        session_argument: hasura_session
      permissions:
        - role: user
